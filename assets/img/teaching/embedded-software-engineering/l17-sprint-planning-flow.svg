<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="From a raw backlog to a started sprint: the planning sequence described in session 17">
<title>From a raw backlog to a started sprint: the planning sequence described in session 17</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6a45"/></marker></defs>
<rect width="1200" height="330" fill="#ffffff"/>
<g font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" fill="#1a1a1a">
<rect x="20" y="40" width="255" height="84" fill="#f4f4f0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="147.5" y="69.8" text-anchor="middle" font-size="13" font-weight="600">1 · Slice</text>
<text x="147.5" y="86.7" text-anchor="middle" font-size="13" font-weight="400">Whole team cuts the work</text>
<text x="147.5" y="103.6" text-anchor="middle" font-size="13" font-weight="400">into tasks (hundreds)</text>
<line x1="275" y1="82.0" x2="305" y2="82.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="305" y="40" width="255" height="84" fill="#f4f4f0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="432.5" y="69.8" text-anchor="middle" font-size="13" font-weight="600">2 · Refine</text>
<text x="432.5" y="86.7" text-anchor="middle" font-size="13" font-weight="400">Experienced engineers add</text>
<text x="432.5" y="103.6" text-anchor="middle" font-size="13" font-weight="400">dates, parents, links, text</text>
<line x1="560" y1="82.0" x2="590" y2="82.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="590" y="40" width="255" height="84" fill="#f4f4f0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="717.5" y="69.8" text-anchor="middle" font-size="13" font-weight="600">3 · Prioritise</text>
<text x="717.5" y="86.7" text-anchor="middle" font-size="13" font-weight="400">Leads, architect and</text>
<text x="717.5" y="103.6" text-anchor="middle" font-size="13" font-weight="400">product owner</text>
<line x1="845" y1="82.0" x2="875" y2="82.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="875" y="40" width="255" height="84" fill="#f4f4f0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="1002.5" y="69.8" text-anchor="middle" font-size="13" font-weight="600">4 · Untangle</text>
<text x="1002.5" y="86.7" text-anchor="middle" font-size="13" font-weight="400">Unblock high-priority work</text>
<text x="1002.5" y="103.6" text-anchor="middle" font-size="13" font-weight="400">by its dependencies first</text>
<rect x="20" y="190" width="255" height="84" fill="#f4f4f0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="147.5" y="219.8" text-anchor="middle" font-size="13" font-weight="600">5 · Fill sprints</text>
<text x="147.5" y="236.7" text-anchor="middle" font-size="13" font-weight="400">Until the backlog is empty,</text>
<text x="147.5" y="253.6" text-anchor="middle" font-size="13" font-weight="400">each sprint ≤ 80 % capacity</text>
<line x1="275" y1="232.0" x2="305" y2="232.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="305" y="190" width="255" height="84" fill="#f4f4f0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="432.5" y="219.8" text-anchor="middle" font-size="13" font-weight="600">6 · Calendar</text>
<text x="432.5" y="236.7" text-anchor="middle" font-size="13" font-weight="400">Holidays of team and customer</text>
<text x="432.5" y="253.6" text-anchor="middle" font-size="13" font-weight="400">→ real capacity per sprint</text>
<line x1="560" y1="232.0" x2="590" y2="232.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="590" y="190" width="255" height="84" fill="#f4f4f0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="717.5" y="219.8" text-anchor="middle" font-size="13" font-weight="600">7 · Sprint goal</text>
<text x="717.5" y="236.7" text-anchor="middle" font-size="13" font-weight="400">One observable phrase:</text>
<text x="717.5" y="253.6" text-anchor="middle" font-size="13" font-weight="400">achieved or not?</text>
<line x1="845" y1="232.0" x2="875" y2="232.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="875" y="190" width="255" height="84" fill="#e7efe9" stroke="#2f6a45" stroke-width="1.4"/>
<text x="1002.5" y="219.8" text-anchor="middle" font-size="13" font-weight="600">8 · Start</text>
<text x="1002.5" y="236.7" text-anchor="middle" font-size="13" font-weight="400">Whole team confirms</text>
<text x="1002.5" y="253.6" text-anchor="middle" font-size="13" font-weight="400">— countdown begins</text>
<path d="M 1002.5 124 C 1002.5 160, 147.5 140, 147.5 188" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="312" text-anchor="start" font-size="12.5" font-weight="400" fill="#555">Output of step 5: the number of sprints gives the project end date; buffer and calendar corrections are added on top.</text>
</g></svg>
