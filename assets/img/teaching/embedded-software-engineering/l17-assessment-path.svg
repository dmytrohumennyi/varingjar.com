<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" role="img" aria-label="Second assessment (announced 17 Nov 2026): the individual path from company to tasks">
<title>Second assessment (announced 17 Nov 2026): the individual path from company to tasks</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6a45"/></marker></defs>
<rect width="1240" height="470" fill="#ffffff"/>
<g font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" fill="#1a1a1a">
<rect x="20" y="20" width="275" height="44" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="157.5" y="47.4" text-anchor="middle" font-size="15" font-weight="600">A · Company</text>
<rect x="20" y="64" width="275" height="250" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="34" y="96" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Name, goal, domain</text>
<text x="34" y="134" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Set-up, location, budget</text>
<text x="34" y="172" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">One-pager website (AI-assisted),</text>
<text x="34" y="210" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">published on free hosting</text>
<text x="34" y="248" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Presentation in the same style</text>
<text x="34" y="286" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Conference poster, business cards</text>
<line x1="295" y1="190" x2="325" y2="190" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="325" y="20" width="275" height="44" fill="#f3eef7" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="462.5" y="47.4" text-anchor="middle" font-size="15" font-weight="600">B · Conference</text>
<rect x="325" y="64" width="275" height="250" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="339" y="96" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">A real conference in 2027</text>
<text x="339" y="134" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Simulated arrangement with</text>
<text x="339" y="172" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">organisers, fee “paid”</text>
<text x="339" y="210" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Trip preparation, contact</text>
<text x="339" y="248" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">with the travel desk</text>
<text x="339" y="286" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">The trip</text>
<line x1="600" y1="190" x2="630" y2="190" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="630" y="20" width="275" height="44" fill="#f7f1e8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="767.5" y="47.4" text-anchor="middle" font-size="15" font-weight="600">C · Customer</text>
<rect x="630" y="64" width="275" height="250" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="644" y="96" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Meeting with a customer</text>
<text x="644" y="134" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Discussion</text>
<text x="644" y="172" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Follow-up meeting 1</text>
<text x="644" y="210" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Follow-up meeting 2</text>
<text x="644" y="248" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Conversion into a customer</text>
<text x="644" y="286" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Ongoing communication</text>
<line x1="905" y1="190" x2="935" y2="190" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="935" y="20" width="275" height="44" fill="#e7efe9" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="1072.5" y="47.4" text-anchor="middle" font-size="15" font-weight="600">D · Project start</text>
<rect x="935" y="64" width="275" height="250" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="949" y="96" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Proposal</text>
<text x="949" y="134" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Architecture description</text>
<text x="949" y="172" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Decomposition into tasks:</text>
<text x="949" y="210" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Trello, Jira or</text>
<text x="949" y="248" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">GitHub Projects</text>
<rect x="20" y="345" width="1200" height="100" fill="#fbfbf8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="40" y="375" text-anchor="start" font-size="14" font-weight="600" fill="#1a1a1a">Deliverable: one screen recording per student with voice-over, playing the roles, covering all stages A–D.</text>
<text x="40" y="402" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Total length ≤ 15 min · individual work · where to put the emphasis is your choice (part of your sales strategy).</text>
<text x="40" y="427" text-anchor="start" font-size="13" font-weight="400" fill="#1a1a1a">Submit by 27 Nov 2026 — the assessment sheet closes on 30 Nov, and the lecturer needs time to check.</text>
</g></svg>
