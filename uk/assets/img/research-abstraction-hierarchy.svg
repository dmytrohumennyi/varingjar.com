  <rect width="720" height="580" fill="white"/>
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Abstraction Hierarchy for System Survivability</text>
  
  <rect x="160" y="45" width="400" height="85" fill="white" stroke="#000" stroke-width="2"/>
  <rect x="160" y="45" width="400" height="25" fill="#E8E8E8" stroke="#000" stroke-width="2"/>
  <text x="360" y="63" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">MISSION LAYER</text>
  <text x="175" y="88" font-family="Arial" font-size="10">Objective function: Φ(t) = Σᵢ wᵢ · φᵢ(t), where φᵢ ∈ {0, 1}</text>
  <text x="175" y="103" font-family="Arial" font-size="10">Modes: NOMINAL → DEGRADED → LIMP_HOME → SAFE_STOP</text>
  <text x="175" y="118" font-family="Arial" font-size="10">Transition criterion: Φ(t) &lt; Φ_threshold(mode)</text>
  
