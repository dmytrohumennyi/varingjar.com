  <text x="695" y="200" font-family="Arial" font-size="9" transform="rotate(90, 695, 200)">Feedback: S(t), ρᵢ(t)</text>
  
  <rect x="40" y="510" width="300" height="60" fill="white" stroke="#000" stroke-width="1"/>
  <text x="50" y="528" font-family="Arial" font-size="10" font-weight="bold">Resource States:</text>
