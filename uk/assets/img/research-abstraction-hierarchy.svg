  <text x="175" y="545" font-family="Arial" font-size="9">D - Degraded</text>
  <rect x="255" y="535" width="20" height="12" fill="#333" stroke="#000"/>
  <text x="280" y="545" font-family="Arial" font-size="9">F - Failed</text>
  <text x="50" y="562" font-family="Arial" font-size="9">ρᵢ ∈ [0,1] — resource operability coefficient</text>
  
  <rect x="360" y="510" width="320" height="60" fill="white" stroke="#000" stroke-width="1"/>
  <text x="370" y="528" font-family="Arial" font-size="10" font-weight="bold">Survivability Function:</text>
  <text x="370" y="548" font-family="Arial" font-size="10" font-style="italic">S(t) = Σⱼ wⱼ · fⱼ(ρ₁...ρₙ) · δⱼ(t)</text>
  <text x="370" y="565" font-family="Arial" font-size="9">δⱼ(t) ∈ {0,1} — function Fⱼ activation state</text>
